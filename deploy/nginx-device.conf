# Illustrative HTTP-context configuration, not an installable production file.
# Supply TLS certificates, a rejecting default HTTPS server, resource limits,
# redacted logging and your deployment's existing security configuration.
# Use only trusted loopback upstreams. Do not trust incoming forwarded headers.

server {
    listen 443 ssl;
    server_name app.example.com;
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/private-key.pem;

    # These three endpoints validate their own protocol credentials; no auth_request.
    location = /_gate/oauth/device_authorization {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host app.example.com;
        proxy_set_header Authorization $http_authorization;
    }
    location = /_gate/oauth/token {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host app.example.com;
        proxy_set_header Authorization $http_authorization;
    }
    location = /_gate/oauth/revoke {
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host app.example.com;
        proxy_set_header Authorization $http_authorization;
    }

    location = /_gate/check {
        internal;
        proxy_pass http://127.0.0.1:8081;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host app.example.com;
        proxy_set_header Authorization $http_authorization;
    }
    location = /_gate/redirect {
        internal;
        proxy_pass http://127.0.0.1:8081;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host app.example.com;
        proxy_set_header X-Original-URI $request_uri;
        # Gate returns 401 + WWW-Authenticate for bearer requests, never an HTML redirect.
        proxy_set_header Authorization $http_authorization;
    }

    # Existing browser sign-in surface. Do not expose an arbitrary /_gate/oauth/* prefix.
    location ~ ^/_gate/(login|auth/options|auth/finish|static/gate\.js|static/gate\.css)$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host app.example.com;
        proxy_set_header Authorization $http_authorization;
    }
    location /_gate/ { return 404; }

    location / {
        auth_request /_gate/check;
        error_page 401 = /_gate/redirect;
        auth_request_set $gate_cookie $upstream_http_x_pg_upstream_cookie;
        proxy_set_header Cookie $gate_cookie;
        # The opaque Gate credential must never reach Cockpit or another upstream.
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:9000;
        # Keep the application's existing SSE/WebSocket settings here.
    }
}

server {
    listen 443 ssl;
    server_name auth.example.com;
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/private-key.pem;

    location = / { return 302 /_gate/manage; }
    location = /_gate/check { return 404; }
    location = /_gate/redirect { return 404; }
    location /_gate/oauth/ { return 404; }
    # Gate enforces human session, CSRF, host/origin, UV and explicit device approval.
    # A valid cookie alone can display the page, but cannot approve a device.
    location /_gate/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host auth.example.com;
        proxy_set_header Authorization $http_authorization;
    }
    location / { return 404; }
}
